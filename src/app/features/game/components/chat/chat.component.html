<div class="chat" [class.history-open]="historyOpen()">
  <div class="messages" #msgList>
    @for (msg of messages(); track msg.id) {
      <div class="message" [class.mine]="msg.userId === myUserId()" [class.pm]="msg.isPrivate">
        @if (msg.rank >= 1) {
          <img src="assets/images/modo.png" [alt]="msg.rank >= 2 ? 'Admin' : 'Modo'" class="chat-badge" />
        }
        @if (msg.isPrivate) {
          <span class="mp-tag">[MP]</span>
        }
        <strong>{{ msg.username }}:</strong> {{ msg.text }}
      </div>
    } @empty {
      <div class="message empty">Aucun message. Soyez le premier à parler&nbsp;!</div>
    }
  </div>
  <div class="new-message">
    <div class="bar">
      <div class="open_close" (click)="toggleHistory()" [title]="historyOpen() ? 'Fermer le chat' : 'Ouvrir le chat'">{{ historyOpen() ? '-' : '+' }}</div>
      <input
        type="text"
        class="chat-input"
        [(ngModel)]="text"
        (keyup.enter)="send()"
        placeholder="Écrire un message..."
        aria-label="Écrire un message"
        autocomplete="off" />
      <div class="emoji-toggle" [class.active]="emojiPickerOpen()" (click)="toggleEmojiPicker()"
           title="Émoticônes" role="button" tabindex="0" (keyup.enter)="toggleEmojiPicker()">🙂</div>
      <div class="enter" (click)="send()" role="button" tabindex="0" (keyup.enter)="send()">⏎</div>
    </div>
  </div>

  @if (emojiPickerOpen()) {
    <div class="emoji-picker">
      <div class="emojis">
        @for (n of emojis; track n) {
          <div class="emoji" title="Emoji {{n}}" (click)="sendSmile(n)" role="button" tabindex="0" (keyup.enter)="sendSmile(n)">
            <img [src]="'assets/images/emojis/' + n + '.png'" [alt]="'Emoji ' + n" width="28" height="28" />
          </div>
        }
      </div>
      <div class="emote-buttons">
        <div class="action-button" title="Cœurs" (click)="sendLove()" role="button" tabindex="0" (keyup.enter)="sendLove()"><img src="assets/images/bouton_coeurs.png" alt="Cœurs" /></div>
        <div class="action-button" title="Zzz" (click)="sendZzz()" role="button" tabindex="0" (keyup.enter)="sendZzz()"><img src="assets/images/bouton_zzz.png" alt="Zzz" /></div>
      </div>
    </div>
  }
</div>
