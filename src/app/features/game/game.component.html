@if (canShowCanvas()) {
  <app-game-canvas
    class="game-canvas"
    [roomId]="roomId"
    [editMode]="editMode()"
    (editModeChange)="editMode.set($event)"
  />
}

@if (canEdit()) {
  <div class="edit-overlay">
    <mat-slide-toggle [(ngModel)]="editMode" color="warn">Mode édition</mat-slide-toggle>
  </div>
}
